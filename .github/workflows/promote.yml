name: promote
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable v6 release tag (for example, v6.7.0)'
        required: true
        type: string
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - v6.*
jobs:
  build-and-promote:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v6\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable v6 release tag, got: $RELEASE_TAG"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build for promotion
        run: npm run build
      - name: Manual publish
        run: |
          cd packages/module
          npm version "${RELEASE_TAG#v}" --git-tag-version false
          npm publish --tag=latest --access=public
